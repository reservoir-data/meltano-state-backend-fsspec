name: Publish to PyPI

on:
  push:
    tags: ["*"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build wheel and sdist
    runs-on: ubuntu-latest
    outputs:
      package_name: ${{ steps.baipp.outputs.package_name }}
      package_version: ${{ steps.baipp.outputs.package_version }}
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: hynek/build-and-inspect-python-package@v3.0.2
      id: baipp

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      id-token: write  # Needed for OIDC PyPI publishing
    environment:
      name: publish
      url: https://pypi.org/project/${{ needs.build.outputs.package_name }}/${{ needs.build.outputs.package_version }}

    steps:
    - uses: actions/download-artifact@v8.0.2
      with:
        name: Packages
        path: dist
    - uses: pypa/gh-action-pypi-publish@v1.14.3
